<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · Luniva</title>
  <meta name="theme-color" content="#fbf7f2">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luniva">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-nav"></div>

  <main id="main" class="app-main">
    <div class="app-container narrow-container">
      <header class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-end gap-3">
        <div>
          <h1>Notifications</h1>
          <p id="unread-summary" aria-live="polite"></p>
        </div>
        <button type="button" class="btn btn-outline-luniva" id="mark-all-read">
          <i class="bi bi-check2-all" aria-hidden="true"></i> Mark all as read
        </button>
      </header>

      <section class="lv-card" aria-label="Your notifications">
        <ul class="notification-list" id="notification-list"></ul>
      </section>

      <p class="calm-note mt-3">
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span>Reminders appear here when you open Luniva — a website can't send alerts while it's closed.
        Choose which ones you get in <a href="settings.html">Settings</a>.</span>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sync.js"></script>
</body>
</html>
