<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · Luniva</title>
  <meta name="theme-color" content="#fbf7f2">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luniva">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-nav"></div>

  <main id="main" class="app-main">
    <div class="app-container" id="history-page">
      <header class="page-header">
        <h1>History</h1>
        <p>Every day you've recorded, newest first. Tap a date to edit it.</p>
      </header>

      <!-- Filters -->
      <form class="lv-card history-filters" id="history-filters" aria-label="Filter records">
        <div class="filter-grid">
          <div>
            <label class="form-label" for="filter-month">Month</label>
            <select class="form-select" id="filter-month"><option value="all">All months</option></select>
          </div>
          <div>
            <label class="form-label" for="filter-pain">Pain level</label>
            <select class="form-select" id="filter-pain">
              <option value="any">Any</option>
              <option value="low">Mild (0–3)</option>
              <option value="medium">Moderate (4–6)</option>
              <option value="high">Strong (7–10)</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="filter-mood">Mood</label>
            <select class="form-select" id="filter-mood"><option value="all">Any mood</option></select>
          </div>
          <div>
            <label class="form-label" for="filter-symptom">Symptoms</label>
            <select class="form-select" id="filter-symptom"><option value="all">Any symptom</option></select>
          </div>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
          <div class="form-check form-switch mb-0 d-flex align-items-center gap-2">
            <input class="form-check-input" type="checkbox" role="switch" id="filter-period">
            <label class="form-check-label" for="filter-period">🩸 Period days only</label>
          </div>
          <button type="reset" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset filters</button>
        </div>
      </form>

      <p class="small text-muted-soft mt-3 mb-2" id="history-count" aria-live="polite"></p>

      <div id="history-table-wrap">
        <!-- Table for desktops -->
        <div class="lv-card history-table-card d-none d-lg-block">
          <table class="table history-table align-middle mb-0">
            <caption class="visually-hidden">Your recorded days</caption>
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Period status</th>
                <th scope="col">Flow</th>
                <th scope="col">Pain</th>
                <th scope="col">Mood</th>
                <th scope="col">Sleep</th>
                <th scope="col">Cravings</th>
                <th scope="col">Notes</th>
              </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
          </table>
        </div>
        <!-- Cards for phones and tablets -->
        <ul class="history-cards d-lg-none" id="history-cards"></ul>
      </div>
      <div class="lv-card" id="history-empty" hidden></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/insights.js"></script>
</body>
</html>
